# Per-function deploy settings. Without this file, `supabase functions
# deploy <name>` silently resets every function to the platform default
# (verify_jwt = true) unless --no-verify-jwt is passed by hand on every
# single deploy — which is exactly how stripe-webhook, telnyx-call-status,
# and both wallet cron functions went dark for ~5 hours on 2026-07-09: a
# batch redeploy omitted the flag, the Supabase gateway started rejecting
# every request from Stripe/Telnyx/pg_cron with 401 UNAUTHORIZED_NO_AUTH_HEADER
# before our own code ever ran, and nothing in the deploy output said so.
#
# These four functions are called by something that is NOT a Supabase-
# signed JWT (Stripe's Stripe-Signature header, Telnyx's unauthenticated
# webhook POST, or pg_cron's custom WALLET_CRON_SECRET bearer token) — the
# platform gate must be off, and each function does its own internal auth
# check instead (Stripe signature verification, or a WALLET_CRON_SECRET /
# service-role comparison). Every other function in this project is called
# by the authenticated browser client with the user's real session JWT, so
# the platform default (verify_jwt = true) is correct and desired there —
# do not add functions here unless their caller genuinely cannot supply a
# Supabase JWT.

[functions.stripe-webhook]
verify_jwt = false

# ADDED 2026-07-28 — these two were ALREADY live as verify_jwt = false but were
# missing from this file, which is precisely the trap it exists to prevent: the
# next `supabase functions deploy` without `--no-verify-jwt` would have reset
# them to the platform default and taken them dark, exactly as happened on
# 2026-07-09. Found by re-checking every function against this file after a
# deploy. Adding them here changes no live state; it makes the next deploy
# correct.
#
# gmail-oauth-callback: Google redirects the user's BROWSER here with an
# authorization code and no Authorization header — there is no Supabase JWT to
# supply. It validates the OAuth `state` parameter itself.
[functions.gmail-oauth-callback]
verify_jwt = false

# lead-ingest: lead vendors POST here from their own servers, authenticated by
# the per-vendor `?token=` in the URL (see loadVendorWebhooks in app.html).
# They have no Supabase credentials at all. _shared/cors.ts already lists this
# one as webhook-only.
[functions.lead-ingest]
verify_jwt = false

# telnyx-call-status is the APP-LEVEL webhook for the one Telnyx Call Control
# application (ProducerStack Dialer, 2983088288312592018) and therefore the only
# place an INBOUND call can land — outbound legs override webhook_url per call,
# inbound cannot. Since 20260801 it carries three callers: the agent-bridge
# click-to-call flow, the Power Dialer, and a single guarded branch that hands
# AI-inbound calls to _shared/ai-inbound.ts. That branch sits AFTER the
# power-dialer check and answers with a webhook_url override, so this function
# sees an AI-inbound call at most twice and the dialer's own path is untouched.
# No NEW webhook-receiving function was added this round — see
# docs/ai-inbound-routing.md for why that was the least invasive option.
[functions.telnyx-call-status]
verify_jwt = false

# email-verify: the six-digit email check on step 1 of sign-up. Its "send" and
# "check" actions run BEFORE the account exists, so there is no session and no
# JWT for the platform to verify — a gate here would make sign-up impossible,
# not safer. Its third action, "claim", validates a real user token itself
# (sb.auth.getUser) exactly the way stripe-create-checkout does.
#
# Because it is openly reachable it enforces its own bounds instead: 45s
# between sends and 5/hour per ADDRESS, 20/hour per IP, ~10 min and 5 attempts
# per code. Those live in _shared/auth-verify.ts and are pinned by
# test/email-verification.test.mjs. After any deploy, an unauthenticated POST
# with a bad action must answer {"error":"unknown_action"} — that is the
# function's own check replying, i.e. proof the platform gate is still off.
[functions.email-verify]
verify_jwt = false

[functions.wallet-renew-numbers]
verify_jwt = false

[functions.wallet-low-balance-notify]
verify_jwt = false

# Phase 2 (messaging): same rationale as above. messaging-delivery-webhook
# and messaging-inbound-webhook are called by Telnyx (Ed25519-signed, not a
# Supabase JWT); messaging-email-inbound-webhook is called by Resend
# (Svix-signed); messaging-timeout-sweep and a2p-status-poll are pg_cron
# jobs authenticated with WALLET_CRON_SECRET, same as the two wallet cron
# functions above. messaging-send-sms/mms/email and a2p-register are called
# by the authenticated browser client with the user's real session JWT, so
# they correctly use the platform default (verify_jwt = true) and are NOT
# listed here.
[functions.messaging-delivery-webhook]
verify_jwt = false

[functions.messaging-inbound-webhook]
verify_jwt = false

[functions.messaging-email-inbound-webhook]
verify_jwt = false

[functions.messaging-timeout-sweep]
verify_jwt = false

# sms-ai-nudge-sweep is the AI texting agent's quiet-lead follow-up worker,
# called by pg_cron with Bearer SMS_AI_CRON_SECRET — a shared secret, not a
# Supabase-signed JWT, so the platform gate has to be off for the function's
# own check to be the one that answers. Same arrangement as the sweeper above
# it, which it is deliberately NOT part of: that one voids wallet holds and
# sends nothing (see the header of sms-ai-nudge-sweep/index.ts).
#
# Its siblings are NOT listed here on purpose. sms-ai-respond is called by
# messaging-inbound-webhook presenting the SERVICE ROLE KEY, which IS a valid
# Supabase JWT, so it keeps the platform default and stays unreachable from a
# browser. sms-ai-manage is called by the agent's browser with a real session
# JWT and keeps the default too.
[functions.sms-ai-nudge-sweep]
verify_jwt = false

# a2p-status-poll has TWO callers and must stay verify_jwt = false for the
# first of them: pg_cron (Bearer WALLET_CRON_SECRET, not a Supabase JWT) and,
# since the status wizard shipped, the signed-in agent's browser hitting
# "Refresh status" with their real session JWT. The function tells them apart
# itself — cron secret match => full sweep, otherwise the JWT is verified with
# auth.getUser() and the refresh is scoped to that agent's own agent_id. Turning
# the platform gate back ON here would break the cron sweep; the browser path
# is safe either way because it re-verifies the JWT internally regardless.
[functions.a2p-status-poll]
verify_jwt = false

# Phase 2 re-scope (PROMPT_07 §4): messaging-broadcast-run is invoked two
# ways, neither of which supplies a Supabase user JWT — a pg_cron sweep
# (no body, drains every queued/sending broadcast) and a self-invoked
# fetch from messaging-broadcast-create for small lists. Both authenticate
# with the same WALLET_CRON_SECRET bearer token the function checks
# internally. messaging-broadcast-create, messaging-recipients-import,
# messaging-consent-record, messaging-send-optin-invite, a2p-assign-number and
# a2p-verify-otp ARE called by the authenticated browser client (they call
# sbAuth.auth.getUser()), so they correctly use the platform default and are
# NOT listed here.
[functions.messaging-broadcast-run]
verify_jwt = false

# summary-unsubscribe: one-click unsubscribe link clicked by email recipients
# who are not logged in (no Supabase JWT available) — same rationale as the
# webhook functions above. monthly-summary is NOT listed here: it's invoked
# by pg_cron passing the service-role key as the Bearer token, which IS a
# valid Supabase-signed JWT, so the platform default (verify_jwt = true) is
# correct and desired for it.
[functions.summary-unsubscribe]
verify_jwt = false

# email-pipeline: the autonomous carrier-mail orchestrator, invoked only by
# pg_cron twice daily (see supabase/schedule_email_pipeline.sql) with a
# dedicated EMAIL_PIPELINE_CRON_SECRET bearer token — not a Supabase JWT — so
# the platform gate must be off and the function checks the secret internally,
# same as the wallet/messaging cron functions above. The in-app "Sync & parse"
# button does NOT call this function; it invokes gmail-sync / parse-email /
# match-events directly with the user's session JWT, and those keep the
# platform default (verify_jwt = true).
[functions.email-pipeline]
verify_jwt = false

# ai-call-webhook: the Telnyx Call Control + AI Assistant webhook for the AI
# Sales Agent (Phase 1). Telnyx POSTs it unauthenticated (Ed25519-signed, not
# a Supabase JWT), so the platform gate must be off; the function verifies the
# telnyx-signature-ed25519 header itself against TELNYX_PUBLIC_KEY, exactly
# like messaging-delivery-webhook. ai-call-start is NOT listed here — it's
# called by the authenticated browser client with the user's session JWT, so
# it correctly uses the platform default (verify_jwt = true).
[functions.ai-call-webhook]
verify_jwt = false

# ai-call-tools: the endpoint the AI Assistant's WEBHOOK TOOLS call
# mid-conversation (transfer_to_agent, book_appointment). Same caller and the
# same reason as ai-call-webhook — Telnyx POSTs it directly and cannot supply a
# Supabase JWT. It is NOT unauthenticated: it requires the AI_TOOLS_SECRET
# carried in the tool URL (which lives inside the assistant configuration, and
# only we can write that), and it additionally verifies the Telnyx Ed25519
# signature whenever those headers are present, failing closed on a bad one.
[functions.ai-call-tools]
verify_jwt = false

# voice-campaign-tick: the campaign scheduler, invoked every minute by pg_cron
# (see supabase/schedule_voice_campaigns.sql) with a dedicated
# VOICE_CAMPAIGN_CRON_SECRET bearer token — not a Supabase JWT — so the
# platform gate must be off and the function checks the secret itself, exactly
# like email-pipeline. Nothing else calls it: the browser has no business here,
# and a test asserts app.html never mentions it.
#
# voice-campaign-manage (the "Re-evaluate leads now" button, unenroll, resume)
# is deliberately NOT listed: it is called by the signed-in agent's browser
# with a real session JWT and takes the agent from that token, so the platform
# default (verify_jwt = true) is correct and desired.
#
# ai-call-start is STILL not listed, and that is load-bearing. The tick calls
# it with the SERVICE ROLE KEY as its bearer token — itself a valid Supabase
# JWT, so the platform gate is satisfied — and that key is precisely what a
# browser never holds, which is what keeps the internal "agent_id in the body"
# branch out of a client's reach.
[functions.voice-campaign-tick]
verify_jwt = false

# compliance-page: the ONLY function here whose caller is the general public
# rather than a signed webhook or a cron secret. It server-renders each
# agent's 10DLC privacy policy / terms at /a/<slug>, and the people who fetch
# it are carrier compliance reviewers using ordinary browsers and simple
# fetchers — they have no Supabase JWT and no way to obtain one. A 401 from
# the platform gate here is not a broken request, it is a failed brand
# registration and an agent who cannot text.
#
# There is correspondingly no internal auth check inside the function (unlike
# every other entry above, which verifies a signature or a shared secret):
# the pages are intentionally public documents. What limits exposure instead
# is the query — it selects an explicit column list, and only for rows whose
# compliance_page_published_at is non-null. An unpublished or unknown slug
# renders the same static 404 as a typo.
#
# SINCE THE SMS OPT-IN PAGE (2026-07-28) IT ALSO TAKES A POST, on exactly one
# route (/a/<slug>/sms-opt-in), and that POST WRITES consent_records. It is
# still correct for the function to be public — the entire point is that a
# consumer with no account can give consent — but it is no longer a read-only
# surface, so the bounds live in the function instead of in the gateway:
# published-slug lookup, a honeypot field, a per-IP hourly cap, and a refusal
# to override an existing dnc_list entry. Read the header of
# compliance-page/index.ts before changing any of them.
[functions.compliance-page]
verify_jwt = false
